# iOS 移植 CI：macOS 构建 + 模拟器冒烟 + Android 回归 + 证据回传
#
# 结构：
#   ios      —— macOS runner：pub get / analyze / test / 设备版 release 构建 / 模拟器 debug 构建 / 模拟器冒烟截图
#   android  —— ubuntu runner：flutter build apk --release（证明 Dart 侧改动没有破坏 Android 构建；非阻塞）
#   report   —— 汇总两个 job 的证据，一次性回传到 ci-artifacts 分支（孤儿提交，只放产物）
#
# 产物回传失败也照常回传（if: always()）；业务分支不受影响。
# 说明文档：docs/ios-ci.md
name: iOS CI

on:
  push:
    branches: [ios/port, ci/ipa]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner 标签（默认 macos-15；备选 macos-14 / macos-26）"
        type: string
        default: macos-15
      xcode_app:
        description: "可选：Xcode.app 绝对路径；留空用 runner 默认 Xcode"
        type: string
        default: ""
      allow_test_failures:
        description: "排障用：flutter test 失败也判本 job 成功（默认 false）"
        type: boolean
        default: false
      skip_android:
        description: "排障用：跳过 Android 回归构建（默认 false，正常运行）"
        type: boolean
        default: false

permissions:
  contents: write          # 回传 ci-artifacts 分支需要

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"     # 与本地 SDK 一致（stable / Dart 3.13.5）
  APP_DIR: "dsh-mobile-app"
  ARTIFACTS_BRANCH: "ci-artifacts"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1) iOS：macOS 构建 + 模拟器冒烟
  # ────────────────────────────────────────────────────────────────────────────
  ios:
    name: iOS 构建 + 模拟器冒烟（macOS）
    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 100
    env:
      CI_OUT: ${{ github.workspace }}/ci-out
      BUILD_LOG: ${{ github.workspace }}/ci-out/build.log
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Windows 侧 core.autocrlf=true，工具脚本可能以 CRLF 提交；这里统一成 LF（幂等）。
      - name: 规范化 CI 脚本换行
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -uo pipefail
          mkdir -p "$CI_OUT"
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true
          echo "CI 脚本换行已规范化（幂等）" > "$BUILD_LOG"

      - name: 环境信息（macOS / Xcode / 模拟器 / CocoaPods）
        id: env
        if: always() && steps.checkout.outcome == 'success'
        env:
          XCODE_APP: ${{ github.event.inputs.xcode_app }}
        run: bash tools/ios-ci/check-env.sh

      # 工程缺失（pbxproj 不存在）时直接失败：此时构建也必然失败，早点暴露省时间
      - name: iOS 工程配置检查（工程缺失则失败；其余项仅记录）
        id: ios_project
        if: always() && steps.checkout.outcome == 'success'
        run: bash tools/ios-ci/check-ios-project.sh

      - name: 安装 Flutter 3.47.7（subosito/flutter-action，带缓存）
        id: install
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 依赖解析 flutter pub get
        id: pub
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/pub-get.sh

      - name: 静态分析 flutter analyze
        id: analyze
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP analyze  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          flutter analyze --no-pub 2>&1 | tee -a "$BUILD_LOG"

      - name: 测试 flutter test（全量测试）
        id: test
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP test  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          rm -rf test/failures   # 仓库提交过历史 golden 失败图，先清掉，确保 failures 只含本次产生的
          flutter test --no-pub --reporter expanded 2>&1 | tee -a "$BUILD_LOG"

      - name: 构建设备版 flutter build ios --release --no-codesign
        id: build_device
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-device  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          flutter build ios --release --no-codesign 2>&1 | tee -a "$BUILD_LOG"

      # ── IPA 打包 / 发布（供 AltStore、Sideloadly 等自签安装）────────────────────
      - name: 打包未签名 IPA（Payload/Runner.app → .ipa）
        id: ipa
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP package-ipa  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then echo '❌ 未找到设备版 Runner.app，跳过 IPA 打包' | tee -a "$BUILD_LOG"; exit 1; fi
          rm -rf /tmp/ipa-payload
          mkdir -p /tmp/ipa-payload/Payload
          cp -R "$APP" /tmp/ipa-payload/Payload/
          ( cd /tmp/ipa-payload && zip -qry "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" Payload )
          ls -lh "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" | tee -a "$BUILD_LOG"
          unzip -l "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" | head -8 | tee -a "$BUILD_LOG"

      - name: 上传未签名 IPA（Actions artifact，需登录下载）
        id: ipa_artifact
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: DSH-Remote-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: 发布/更新 ios-unsigned Release（公开下载，免登录）
        id: ipa_release
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! gh release view ios-unsigned >/dev/null 2>&1; then
            gh release create ios-unsigned \
              --target "$GITHUB_SHA" \
              --title 'iOS 未签名 IPA（自动构建）' \
              --notes '由 GitHub Actions 自动构建的未签名 IPA。安装需用 AltStore / Sideloadly 自签（个人 Apple ID 即可）。详见 docs/ios-unsigned-ipa.md。' \
              --prerelease
          fi
          gh release upload ios-unsigned DSH-Remote-unsigned.ipa --clobber
      - name: 构建模拟器版 flutter build ios --simulator --debug
        id: build_sim
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-sim  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          # 设备版 Runner.app 不能装进模拟器，冒烟必须用 iphonesimulator 产物
          flutter build ios --simulator --debug 2>&1 | tee -a "$BUILD_LOG"

      - name: iOS Simulator 冒烟（启动 / 安装 / 启动 App / 首帧计时 / 截图 / 存活校验）
        id: smoke
        if: always() && steps.build_sim.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_WAIT_SEC: "12"
        run: bash tools/ios-ci/sim-smoke.sh

      - name: 集成测试 flutter test integration_test（复用冒烟用模拟器）
        id: integration
        if: always() && steps.build_sim.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP integration-test  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          if [ ! -d integration_test ]; then
            echo "integration_test/ 目录不存在，跳过（dart-platform 提交后自动生效）" | tee -a "$BUILD_LOG"
            exit 0
          fi
          # UDID 来源：sim-smoke.sh 先写 sim-info.txt（udid= 键值），再写 sim-udid.txt（裸 UDID 一行）
          UDID="$(sed -n 's/^udid=//p' "$CI_OUT/sim-info.txt" 2>/dev/null | head -1)"
          [ -n "$UDID" ] || UDID="$(head -1 "$CI_OUT/sim-udid.txt" 2>/dev/null || true)"
          UDID="$(printf '%s' "$UDID" | tr -d '[:space:]')"
          if [ -z "$UDID" ]; then
            echo "❌ 无法定位冒烟用的模拟器 UDID（sim-info.txt / sim-udid.txt 均不可用）；不做 name 兜底，直接失败以免跑错设备" | tee -a "$BUILD_LOG"
            exit 1
          fi
          echo "使用冒烟步骤启动的模拟器 UDID: $UDID" | tee -a "$BUILD_LOG"
          xcrun simctl list devices booted 2>&1 | tee -a "$BUILD_LOG" || true
          flutter test integration_test -d "$UDID" --reporter expanded 2>&1 | tee -a "$BUILD_LOG"

      - name: 收集产物（清单 / 日志 / 截图 / golden 失败图）
        id: collect
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/collect-artifacts.sh

      - name: 汇总 iOS 结果（写 status.txt / summary.md）
        id: verdict
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_ENV: ${{ steps.env.outcome }}
          OUT_IOS_PROJECT: ${{ steps.ios_project.outcome }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_PUB: ${{ steps.pub.outcome }}
          OUT_ANALYZE: ${{ steps.analyze.outcome }}
          OUT_TEST: ${{ steps.test.outcome }}
          OUT_BUILD_DEVICE: ${{ steps.build_device.outcome }}
          OUT_BUILD_SIM: ${{ steps.build_sim.outcome }}
          OUT_SMOKE: ${{ steps.smoke.outcome }}
          OUT_INTEGRATION: ${{ steps.integration.outcome }}
          OUT_COLLECT: ${{ steps.collect.outcome }}
          ALLOW_TEST_FAIL: ${{ github.event.inputs.allow_test_failures || 'false' }}
          ALLOW_FAIL_STEPS: "integration-test"
        run: bash tools/ios-ci/verdict.sh

      # 兜底通道：即使 report job / artifact 传递出问题，也能从 ci-artifacts-ios 分支拿到 iOS 全量日志。
      # 只推小文件（阈值 8MB），并显式排除 *.zip 归档（设备版 .app 约 12MB，不该重复推）；
      # 正式证据仍以 report job 的 ci-artifacts 为准。
      - name: 兜底回传 iOS 证据（直传 ci-artifacts-ios 分支）
        id: publish_fallback
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_BRANCH: ci-artifacts-ios
          ARTIFACT_MAX_BYTES: "8388608"
          ARTIFACT_SKIP_GLOBS: "*.zip"
        run: bash tools/ios-ci/publish-artifacts.sh

      - name: 上传 iOS 证据（交给 report job 汇总回传）
        id: upload
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence
          path: ci-out/
          if-no-files-found: warn
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 2) Android：release APK 回归构建（非阻塞，失败不影响 iOS 结论）
  # ────────────────────────────────────────────────────────────────────────────
  android:
    name: Android release APK 回归（ubuntu）
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    if: ${{ github.event.inputs.skip_android != 'true' }}
    env:
      CI_OUT: ${{ github.workspace }}/ci-out
      BUILD_LOG: ${{ github.workspace }}/ci-out/build.log
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 规范化 CI 脚本换行
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$CI_OUT"
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true
          echo "CI 脚本换行已规范化（幂等）" > "$BUILD_LOG"

      # 工程用 AGP 9.1.0 / Gradle 9.5.0；JDK 21 同时满足 AGP 与 Gradle 要求（JDK 17 亦可用，选 21 更稳）
      - name: 安装 JDK 21
        id: java
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 记录 Android 工具链版本（JDK / Gradle / SDK）
        id: toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          printf '\n===== STEP android-toolchain  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          java -version 2>&1 | tee -a "$BUILD_LOG"
          echo "JAVA_HOME=${JAVA_HOME:-}" | tee -a "$BUILD_LOG"
          grep distributionUrl dsh-mobile-app/android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | tee -a "$BUILD_LOG" || true
          echo "ANDROID_HOME=${ANDROID_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" | tee -a "$BUILD_LOG"
          grep -o 'com.android.application[^\"]*' dsh-mobile-app/android/settings.gradle.kts 2>/dev/null | head -1 | tee -a "$BUILD_LOG" || true

      - name: 安装 Flutter 3.47.7
        id: install
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 缓存 Gradle 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh-mobile-app/android/**/*.gradle*', 'dsh-mobile-app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 依赖解析 flutter pub get
        id: pub
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/pub-get.sh

      - name: 构建 Android release APK（回归验证）
        id: build_apk
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-apk  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          # v2 首跑实测根因：前一步 flutter pub get 以 releaseMode=false 生成 GeneratedPluginRegistrant.java
          #（含 dev 依赖 integration_test），而 build 带 --no-pub 时不会以 releaseMode=true 重新注入插件，
          # 于是 release 编译找不到 dev.flutter.plugins.integration_test。
          # 修法（双保险）：
          #   ① flutter build 不带 --no-pub（构建自己以 release 模式重新生成 registrant，过滤 dev 依赖）；
          #   ② 仍临时摘掉 integration_test dev 依赖（lib/ 不允许 import dev 依赖，语义等价），
          #      即使未来 Flutter 版本行为再变也能拿到干净的 release 编译证据；构建后立即恢复。
          cp pubspec.yaml /tmp/pubspec.yaml.ci-bak
          cp pubspec.lock /tmp/pubspec.lock.ci-bak
          awk '
            /^  integration_test:$/ { skip = 1; next }
            skip == 1 && /^[[:space:]]+sdk:[[:space:]]+flutter[[:space:]]*$/ { skip = 0; next }
            { print }
          ' pubspec.yaml > /tmp/pubspec.yaml.ci-stripped
          if cmp -s pubspec.yaml /tmp/pubspec.yaml.ci-stripped; then
            echo "⚠️ pubspec.yaml 未变化：未找到 integration_test 依赖，按原样构建" | tee -a "$BUILD_LOG"
          else
            mv /tmp/pubspec.yaml.ci-stripped pubspec.yaml
            echo "已临时移除 integration_test dev 依赖（仅 CI 工作区，构建后恢复）" | tee -a "$BUILD_LOG"
          fi
          flutter pub get 2>&1 | tee -a "$BUILD_LOG"
          # 仓库没有 key.properties，release 会回退 debug 签名（见 android/app/build.gradle.kts），CI 可构建。
          # 注意：不要加 --no-pub —— 必须让 build 以 release 模式重新注入插件（见上方根因说明）。
          flutter build apk --release 2>&1 | tee -a "$BUILD_LOG"
          RC=$?
          cp /tmp/pubspec.yaml.ci-bak pubspec.yaml
          cp /tmp/pubspec.lock.ci-bak pubspec.lock
          exit $RC

      - name: 收集 Android 证据
        id: collect
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          OUT_BUILD_APK: ${{ steps.build_apk.outcome }}
        run: bash tools/ios-ci/android-collect.sh

      - name: 上传 Android 证据
        id: upload
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-evidence
          path: ci-out/
          if-no-files-found: warn
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────────────
  # 3) report：汇总证据 -> 生成 summary/run.json -> 回传 ci-artifacts 分支
  # ────────────────────────────────────────────────────────────────────────────
  report:
    name: 汇总证据并回传 ci-artifacts 分支
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_OUT: ${{ github.workspace }}/ci-out-report
      BUILD_LOG: ${{ github.workspace }}/ci-out-report/build.log
      STAGING: ${{ github.workspace }}/staging
      IOS_RESULT: ${{ needs.ios.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 规范化 CI 脚本换行
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -uo pipefail
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true

      - name: 下载 iOS 证据
        id: dl_ios
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-evidence
          path: staging/ios

      - name: 下载 Android 证据
        id: dl_android
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-evidence
          path: staging/android

      - name: 汇总证据（summary.md / run.json / status.txt / 目录结构）
        id: assemble
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/assemble-report.sh

      - name: 回传产物到 ci-artifacts 分支
        id: publish
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ios-ci/publish-artifacts.sh

      - name: 结果门禁（iOS 红则整体红；Android 失败只记录不阻塞）
        id: gate
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          IOS_JOB_RESULT: ${{ needs.ios.result }}
        run: |
          set -uo pipefail
          status="$(cat "$CI_OUT/status.txt" 2>/dev/null || echo failure)"
          echo "iOS 结论: $status"
          echo "iOS job: ${IOS_JOB_RESULT:-unknown}"
          if [ "$status" != "success" ]; then
            echo "失败 / 未完成步骤："
            cat "$CI_OUT/failed-steps.txt" 2>/dev/null || echo "(无法读取 failed-steps.txt)"
            exit 1
          fi
          if [ "${IOS_JOB_RESULT:-}" != "success" ]; then
            echo "❌ iOS job 结果不是 success"
            exit 1
          fi
          # 证据回传失败不影响构建结论（两者解绑）：只报警告，靠 ci-artifacts 分支是否更新来判断回传状态
          if [ "${PUBLISH_OUTCOME:-}" != "success" ]; then
            echo "::warning::证据回传（ci-artifacts 分支）未成功（PUBLISH_OUTCOME=${PUBLISH_OUTCOME:-missing}），但 iOS 构建结论不受影响；请检查仓库 Settings -> Actions -> General -> Workflow permissions（需 Read and write）或查看 report job 日志。"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              echo "> ⚠️ 证据回传未成功（PUBLISH_OUTCOME=${PUBLISH_OUTCOME:-missing}），不影响 iOS 结论；以 ci-artifacts 分支更新为准。" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            fi
          fi
          echo "✅ iOS 结论通过（证据回传状态见上方 warning，若无 warning 即为成功）"
