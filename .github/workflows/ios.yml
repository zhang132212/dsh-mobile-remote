#
# 缁撴瀯锛?#   ios      鈥斺€?macOS runner锛歱ub get / analyze / test / 璁惧鐗?release 鏋勫缓 / 妯℃嫙鍣?debug 鏋勫缓 / 妯℃嫙鍣ㄥ啋鐑熸埅鍥?#   android  鈥斺€?ubuntu runner锛歠lutter build apk --release锛堣瘉鏄?Dart 渚ф敼鍔ㄦ病鏈夌牬鍧?Android 鏋勫缓锛涢潪闃诲锛?#   report   鈥斺€?姹囨€讳袱涓?job 鐨勮瘉鎹紝涓€娆℃€у洖浼犲埌 ci-artifacts 鍒嗘敮锛堝鍎挎彁浜わ紝鍙斁浜х墿锛?#
# 浜х墿鍥炰紶澶辫触涔熺収甯稿洖浼狅紙if: always()锛夛紱涓氬姟鍒嗘敮涓嶅彈褰卞搷銆?# 璇存槑鏂囨。锛歞ocs/ios-ci.md
name: iOS CI

on:
  push:
    branches: [ios/port, ci/ipa]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner 鏍囩锛堥粯璁?macos-15锛涘閫?macos-14 / macos-26锛?
        type: string
        default: macos-15
      xcode_app:
        description: "鍙€夛細Xcode.app 缁濆璺緞锛涚暀绌虹敤 runner 榛樿 Xcode"
        type: string
        default: ""
      allow_test_failures:
        description: "鎺掗殰鐢細flutter test 澶辫触涔熷垽鏈?job 鎴愬姛锛堥粯璁?false锛?
        type: boolean
        default: false
      skip_android:
        description: "鎺掗殰鐢細璺宠繃 Android 鍥炲綊鏋勫缓锛堥粯璁?false锛屾甯歌繍琛岋級"
        type: boolean
        default: false

permissions:
  contents: write          # 鍥炰紶 ci-artifacts 鍒嗘敮闇€瑕?
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"     # 涓庢湰鍦?SDK 涓€鑷达紙stable / Dart 3.13.5锛?  APP_DIR: "dsh-mobile-app"
  ARTIFACTS_BRANCH: "ci-artifacts"

jobs:
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # 1) iOS锛歮acOS 鏋勫缓 + 妯℃嫙鍣ㄥ啋鐑?  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  ios:
    name: iOS 鏋勫缓 + 妯℃嫙鍣ㄥ啋鐑燂紙macOS锛?    runs-on: ${{ github.event.inputs.runner || 'macos-15' }}
    timeout-minutes: 100
    env:
      CI_OUT: ${{ github.workspace }}/ci-out
      BUILD_LOG: ${{ github.workspace }}/ci-out/build.log
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Windows 渚?core.autocrlf=true锛屽伐鍏疯剼鏈彲鑳戒互 CRLF 鎻愪氦锛涜繖閲岀粺涓€鎴?LF锛堝箓绛夛級銆?      - name: 瑙勮寖鍖?CI 鑴氭湰鎹㈣
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -uo pipefail
          mkdir -p "$CI_OUT"
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true
          echo "CI 鑴氭湰鎹㈣宸茶鑼冨寲锛堝箓绛夛級" > "$BUILD_LOG"

      - name: 鐜淇℃伅锛坢acOS / Xcode / 妯℃嫙鍣?/ CocoaPods锛?        id: env
        if: always() && steps.checkout.outcome == 'success'
        env:
          XCODE_APP: ${{ github.event.inputs.xcode_app }}
        run: bash tools/ios-ci/check-env.sh

      # 宸ョ▼缂哄け锛坧bxproj 涓嶅瓨鍦級鏃剁洿鎺ュけ璐ワ細姝ゆ椂鏋勫缓涔熷繀鐒跺け璐ワ紝鏃╃偣鏆撮湶鐪佹椂闂?      - name: iOS 宸ョ▼閰嶇疆妫€鏌ワ紙宸ョ▼缂哄け鍒欏け璐ワ紱鍏朵綑椤逛粎璁板綍锛?        id: ios_project
        if: always() && steps.checkout.outcome == 'success'
        run: bash tools/ios-ci/check-ios-project.sh

      - name: 瀹夎 Flutter 3.47.7锛坰ubosito/flutter-action锛屽甫缂撳瓨锛?        id: install
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 渚濊禆瑙ｆ瀽 flutter pub get
        id: pub
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/pub-get.sh

      - name: 闈欐€佸垎鏋?flutter analyze
        id: analyze
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP analyze  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          flutter analyze --no-pub 2>&1 | tee -a "$BUILD_LOG"

      - name: 娴嬭瘯 flutter test锛堝叏閲忔祴璇曪級
        id: test
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP test  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          rm -rf test/failures   # 浠撳簱鎻愪氦杩囧巻鍙?golden 澶辫触鍥撅紝鍏堟竻鎺夛紝纭繚 failures 鍙惈鏈浜х敓鐨?          flutter test --no-pub --reporter expanded 2>&1 | tee -a "$BUILD_LOG"

      - name: 鏋勫缓璁惧鐗?flutter build ios --release --no-codesign
        id: build_device
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-device  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          flutter build ios --release --no-codesign 2>&1 | tee -a "$BUILD_LOG"

      # 鈹€鈹€ IPA 鎵撳寘 / 鍙戝竷锛堜緵 AltStore銆丼ideloadly 绛夎嚜绛惧畨瑁咃級鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
      - name: 鎵撳寘鏈鍚?IPA锛圥ayload/Runner.app 鈫?.ipa锛?        id: ipa
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP package-ipa  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          APP="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP" ]; then echo '鉂?鏈壘鍒拌澶囩増 Runner.app锛岃烦杩?IPA 鎵撳寘' | tee -a "$BUILD_LOG"; exit 1; fi
          rm -rf /tmp/ipa-payload
          mkdir -p /tmp/ipa-payload/Payload
          cp -R "$APP" /tmp/ipa-payload/Payload/
          ( cd /tmp/ipa-payload && zip -qry "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" Payload )
          ls -lh "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" | tee -a "$BUILD_LOG"
          unzip -l "$GITHUB_WORKSPACE/DSH-Remote-unsigned.ipa" | head -8 | tee -a "$BUILD_LOG"

      - name: 涓婁紶鏈鍚?IPA锛圓ctions artifact锛岄渶鐧诲綍涓嬭浇锛?        id: ipa_artifact
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: DSH-Remote-unsigned.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: 鍙戝竷/鏇存柊 ios-unsigned Release锛堝叕寮€涓嬭浇锛屽厤鐧诲綍锛?        id: ipa_release
        if: steps.build_device.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          if ! gh release view ios-unsigned >/dev/null 2>&1; then
            gh release create ios-unsigned \
              --target "$GITHUB_SHA" \
              --title 'iOS 鏈鍚?IPA锛堣嚜鍔ㄦ瀯寤猴級' \
              --notes '鐢?GitHub Actions 鑷姩鏋勫缓鐨勬湭绛惧悕 IPA銆傚畨瑁呴渶鐢?AltStore / Sideloadly 鑷锛堜釜浜?Apple ID 鍗冲彲锛夈€傝瑙?docs/ios-unsigned-ipa.md銆? \
              --prerelease
          fi
          gh release upload ios-unsigned DSH-Remote-unsigned.ipa --clobber
      - name: 鏋勫缓妯℃嫙鍣ㄧ増 flutter build ios --simulator --debug
        id: build_sim
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-sim  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          # 璁惧鐗?Runner.app 涓嶈兘瑁呰繘妯℃嫙鍣紝鍐掔儫蹇呴』鐢?iphonesimulator 浜х墿
          flutter build ios --simulator --debug 2>&1 | tee -a "$BUILD_LOG"

      - name: iOS Simulator 鍐掔儫锛堝惎鍔?/ 瀹夎 / 鍚姩 App / 棣栧抚璁℃椂 / 鎴浘 / 瀛樻椿鏍￠獙锛?        id: smoke
        if: always() && steps.build_sim.outcome == 'success'
        continue-on-error: true
        env:
          SMOKE_WAIT_SEC: "12"
        run: bash tools/ios-ci/sim-smoke.sh

      - name: 闆嗘垚娴嬭瘯 flutter test integration_test锛堝鐢ㄥ啋鐑熺敤妯℃嫙鍣級
        id: integration
        if: always() && steps.build_sim.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 15
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP integration-test  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          if [ ! -d integration_test ]; then
            echo "integration_test/ 鐩綍涓嶅瓨鍦紝璺宠繃锛坉art-platform 鎻愪氦鍚庤嚜鍔ㄧ敓鏁堬級" | tee -a "$BUILD_LOG"
            exit 0
          fi
          # UDID 鏉ユ簮锛歴im-smoke.sh 鍏堝啓 sim-info.txt锛坲did= 閿€硷級锛屽啀鍐?sim-udid.txt锛堣８ UDID 涓€琛岋級
          UDID="$(sed -n 's/^udid=//p' "$CI_OUT/sim-info.txt" 2>/dev/null | head -1)"
          [ -n "$UDID" ] || UDID="$(head -1 "$CI_OUT/sim-udid.txt" 2>/dev/null || true)"
          UDID="$(printf '%s' "$UDID" | tr -d '[:space:]')"
          if [ -z "$UDID" ]; then
            echo "鉂?鏃犳硶瀹氫綅鍐掔儫鐢ㄧ殑妯℃嫙鍣?UDID锛坰im-info.txt / sim-udid.txt 鍧囦笉鍙敤锛夛紱涓嶅仛 name 鍏滃簳锛岀洿鎺ュけ璐ヤ互鍏嶈窇閿欒澶? | tee -a "$BUILD_LOG"
            exit 1
          fi
          echo "浣跨敤鍐掔儫姝ラ鍚姩鐨勬ā鎷熷櫒 UDID: $UDID" | tee -a "$BUILD_LOG"
          xcrun simctl list devices booted 2>&1 | tee -a "$BUILD_LOG" || true
          flutter test integration_test -d "$UDID" --reporter expanded 2>&1 | tee -a "$BUILD_LOG"

      - name: 鏀堕泦浜х墿锛堟竻鍗?/ 鏃ュ織 / 鎴浘 / golden 澶辫触鍥撅級
        id: collect
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/collect-artifacts.sh

      - name: 姹囨€?iOS 缁撴灉锛堝啓 status.txt / summary.md锛?        id: verdict
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          OUT_CHECKOUT: ${{ steps.checkout.outcome }}
          OUT_ENV: ${{ steps.env.outcome }}
          OUT_IOS_PROJECT: ${{ steps.ios_project.outcome }}
          OUT_INSTALL: ${{ steps.install.outcome }}
          OUT_PUB: ${{ steps.pub.outcome }}
          OUT_ANALYZE: ${{ steps.analyze.outcome }}
          OUT_TEST: ${{ steps.test.outcome }}
          OUT_BUILD_DEVICE: ${{ steps.build_device.outcome }}
          OUT_BUILD_SIM: ${{ steps.build_sim.outcome }}
          OUT_SMOKE: ${{ steps.smoke.outcome }}
          OUT_INTEGRATION: ${{ steps.integration.outcome }}
          OUT_COLLECT: ${{ steps.collect.outcome }}
          ALLOW_TEST_FAIL: ${{ github.event.inputs.allow_test_failures || 'false' }}
          ALLOW_FAIL_STEPS: "integration-test"
        run: bash tools/ios-ci/verdict.sh

      # 鍏滃簳閫氶亾锛氬嵆浣?report job / artifact 浼犻€掑嚭闂锛屼篃鑳戒粠 ci-artifacts-ios 鍒嗘敮鎷垮埌 iOS 鍏ㄩ噺鏃ュ織銆?      # 鍙帹灏忔枃浠讹紙闃堝€?8MB锛夛紝骞舵樉寮忔帓闄?*.zip 褰掓。锛堣澶囩増 .app 绾?12MB锛屼笉璇ラ噸澶嶆帹锛夛紱
      # 姝ｅ紡璇佹嵁浠嶄互 report job 鐨?ci-artifacts 涓哄噯銆?      - name: 鍏滃簳鍥炰紶 iOS 璇佹嵁锛堢洿浼?ci-artifacts-ios 鍒嗘敮锛?        id: publish_fallback
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACTS_BRANCH: ci-artifacts-ios
          ARTIFACT_MAX_BYTES: "8388608"
          ARTIFACT_SKIP_GLOBS: "*.zip"
        run: bash tools/ios-ci/publish-artifacts.sh

      - name: 涓婁紶 iOS 璇佹嵁锛堜氦缁?report job 姹囨€诲洖浼狅級
        id: upload
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-evidence
          path: ci-out/
          if-no-files-found: warn
          retention-days: 7

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # 2) Android锛歳elease APK 鍥炲綊鏋勫缓锛堥潪闃诲锛屽け璐ヤ笉褰卞搷 iOS 缁撹锛?  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  android:
    name: Android release APK 鍥炲綊锛坲buntu锛?    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    if: ${{ github.event.inputs.skip_android != 'true' }}
    env:
      CI_OUT: ${{ github.workspace }}/ci-out
      BUILD_LOG: ${{ github.workspace }}/ci-out/build.log
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 瑙勮寖鍖?CI 鑴氭湰鎹㈣
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p "$CI_OUT"
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true
          echo "CI 鑴氭湰鎹㈣宸茶鑼冨寲锛堝箓绛夛級" > "$BUILD_LOG"

      # 宸ョ▼鐢?AGP 9.1.0 / Gradle 9.5.0锛汮DK 21 鍚屾椂婊¤冻 AGP 涓?Gradle 瑕佹眰锛圝DK 17 浜﹀彲鐢紝閫?21 鏇寸ǔ锛?      - name: 瀹夎 JDK 21
        id: java
        continue-on-error: true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 璁板綍 Android 宸ュ叿閾剧増鏈紙JDK / Gradle / SDK锛?        id: toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          printf '\n===== STEP android-toolchain  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          java -version 2>&1 | tee -a "$BUILD_LOG"
          echo "JAVA_HOME=${JAVA_HOME:-}" | tee -a "$BUILD_LOG"
          grep distributionUrl dsh-mobile-app/android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null | tee -a "$BUILD_LOG" || true
          echo "ANDROID_HOME=${ANDROID_HOME:-} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}" | tee -a "$BUILD_LOG"
          grep -o 'com.android.application[^\"]*' dsh-mobile-app/android/settings.gradle.kts 2>/dev/null | head -1 | tee -a "$BUILD_LOG" || true

      - name: 瀹夎 Flutter 3.47.7
        id: install
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 缂撳瓨 Gradle 渚濊禆
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh-mobile-app/android/**/*.gradle*', 'dsh-mobile-app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 渚濊禆瑙ｆ瀽 flutter pub get
        id: pub
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/pub-get.sh

      - name: 鏋勫缓 Android release APK锛堝洖褰掗獙璇侊級
        id: build_apk
        if: always() && steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: dsh-mobile-app
        run: |
          set -uo pipefail
          printf '\n===== STEP build-apk  %s =====\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" | tee -a "$BUILD_LOG"
          # v2 棣栬窇瀹炴祴鏍瑰洜锛氬墠涓€姝?flutter pub get 浠?releaseMode=false 鐢熸垚 GeneratedPluginRegistrant.java
          #锛堝惈 dev 渚濊禆 integration_test锛夛紝鑰?build 甯?--no-pub 鏃朵笉浼氫互 releaseMode=true 閲嶆柊娉ㄥ叆鎻掍欢锛?          # 浜庢槸 release 缂栬瘧鎵句笉鍒?dev.flutter.plugins.integration_test銆?          # 淇硶锛堝弻淇濋櫓锛夛細
          #   鈶?flutter build 涓嶅甫 --no-pub锛堟瀯寤鸿嚜宸变互 release 妯″紡閲嶆柊鐢熸垚 registrant锛岃繃婊?dev 渚濊禆锛夛紱
          #   鈶?浠嶄复鏃舵憳鎺?integration_test dev 渚濊禆锛坙ib/ 涓嶅厑璁?import dev 渚濊禆锛岃涔夌瓑浠凤級锛?          #      鍗充娇鏈潵 Flutter 鐗堟湰琛屼负鍐嶅彉涔熻兘鎷垮埌骞插噣鐨?release 缂栬瘧璇佹嵁锛涙瀯寤哄悗绔嬪嵆鎭㈠銆?          cp pubspec.yaml /tmp/pubspec.yaml.ci-bak
          cp pubspec.lock /tmp/pubspec.lock.ci-bak
          awk '
            /^  integration_test:$/ { skip = 1; next }
            skip == 1 && /^[[:space:]]+sdk:[[:space:]]+flutter[[:space:]]*$/ { skip = 0; next }
            { print }
          ' pubspec.yaml > /tmp/pubspec.yaml.ci-stripped
          if cmp -s pubspec.yaml /tmp/pubspec.yaml.ci-stripped; then
            echo "鈿狅笍 pubspec.yaml 鏈彉鍖栵細鏈壘鍒?integration_test 渚濊禆锛屾寜鍘熸牱鏋勫缓" | tee -a "$BUILD_LOG"
          else
            mv /tmp/pubspec.yaml.ci-stripped pubspec.yaml
            echo "宸蹭复鏃剁Щ闄?integration_test dev 渚濊禆锛堜粎 CI 宸ヤ綔鍖猴紝鏋勫缓鍚庢仮澶嶏級" | tee -a "$BUILD_LOG"
          fi
          flutter pub get 2>&1 | tee -a "$BUILD_LOG"
          # 浠撳簱娌℃湁 key.properties锛宺elease 浼氬洖閫€ debug 绛惧悕锛堣 android/app/build.gradle.kts锛夛紝CI 鍙瀯寤恒€?          # 娉ㄦ剰锛氫笉瑕佸姞 --no-pub 鈥斺€?蹇呴』璁?build 浠?release 妯″紡閲嶆柊娉ㄥ叆鎻掍欢锛堣涓婃柟鏍瑰洜璇存槑锛夈€?          flutter build apk --release 2>&1 | tee -a "$BUILD_LOG"
          RC=$?
          cp /tmp/pubspec.yaml.ci-bak pubspec.yaml
          cp /tmp/pubspec.lock.ci-bak pubspec.lock
          exit $RC

      - name: 鏀堕泦 Android 璇佹嵁
        id: collect
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          OUT_BUILD_APK: ${{ steps.build_apk.outcome }}
        run: bash tools/ios-ci/android-collect.sh

      - name: 涓婁紶 Android 璇佹嵁
        id: upload
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-evidence
          path: ci-out/
          if-no-files-found: warn
          retention-days: 7

  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  # 3) report锛氭眹鎬昏瘉鎹?-> 鐢熸垚 summary/run.json -> 鍥炰紶 ci-artifacts 鍒嗘敮
  # 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
  report:
    name: 姹囨€昏瘉鎹苟鍥炰紶 ci-artifacts 鍒嗘敮
    needs: [ios, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_OUT: ${{ github.workspace }}/ci-out-report
      BUILD_LOG: ${{ github.workspace }}/ci-out-report/build.log
      STAGING: ${{ github.workspace }}/staging
      IOS_RESULT: ${{ needs.ios.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 瑙勮寖鍖?CI 鑴氭湰鎹㈣
        if: always() && steps.checkout.outcome == 'success'
        run: |
          set -uo pipefail
          for f in tools/ios-ci/*.sh; do
            [ -f "$f" ] || continue
            sed -i '' 's/\r$//' "$f" 2>/dev/null || sed -i 's/\r$//' "$f" 2>/dev/null || true
          done
          chmod +x tools/ios-ci/*.sh 2>/dev/null || true

      - name: 涓嬭浇 iOS 璇佹嵁
        id: dl_ios
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-evidence
          path: staging/ios

      - name: 涓嬭浇 Android 璇佹嵁
        id: dl_android
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-evidence
          path: staging/android

      - name: 姹囨€昏瘉鎹紙summary.md / run.json / status.txt / 鐩綍缁撴瀯锛?        id: assemble
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        run: bash tools/ios-ci/assemble-report.sh

      - name: 鍥炰紶浜х墿鍒?ci-artifacts 鍒嗘敮
        id: publish
        if: always() && steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ios-ci/publish-artifacts.sh

      - name: 缁撴灉闂ㄧ锛坕OS 绾㈠垯鏁翠綋绾紱Android 澶辫触鍙褰曚笉闃诲锛?        id: gate
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          IOS_JOB_RESULT: ${{ needs.ios.result }}
        run: |
          set -uo pipefail
          status="$(cat "$CI_OUT/status.txt" 2>/dev/null || echo failure)"
          echo "iOS 缁撹: $status"
          echo "iOS job: ${IOS_JOB_RESULT:-unknown}"
          if [ "$status" != "success" ]; then
            echo "澶辫触 / 鏈畬鎴愭楠わ細"
            cat "$CI_OUT/failed-steps.txt" 2>/dev/null || echo "(鏃犳硶璇诲彇 failed-steps.txt)"
            exit 1
          fi
          if [ "${IOS_JOB_RESULT:-}" != "success" ]; then
            echo "鉂?iOS job 缁撴灉涓嶆槸 success"
            exit 1
          fi
          # 璇佹嵁鍥炰紶澶辫触涓嶅奖鍝嶆瀯寤虹粨璁猴紙涓よ€呰В缁戯級锛氬彧鎶ヨ鍛婏紝闈?ci-artifacts 鍒嗘敮鏄惁鏇存柊鏉ュ垽鏂洖浼犵姸鎬?          if [ "${PUBLISH_OUTCOME:-}" != "success" ]; then
            echo "::warning::璇佹嵁鍥炰紶锛坈i-artifacts 鍒嗘敮锛夋湭鎴愬姛锛圥UBLISH_OUTCOME=${PUBLISH_OUTCOME:-missing}锛夛紝浣?iOS 鏋勫缓缁撹涓嶅彈褰卞搷锛涜妫€鏌ヤ粨搴?Settings -> Actions -> General -> Workflow permissions锛堥渶 Read and write锛夋垨鏌ョ湅 report job 鏃ュ織銆?
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
              echo "> 鈿狅笍 璇佹嵁鍥炰紶鏈垚鍔燂紙PUBLISH_OUTCOME=${PUBLISH_OUTCOME:-missing}锛夛紝涓嶅奖鍝?iOS 缁撹锛涗互 ci-artifacts 鍒嗘敮鏇存柊涓哄噯銆? >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
            fi
          fi
          echo "鉁?iOS 缁撹閫氳繃锛堣瘉鎹洖浼犵姸鎬佽涓婃柟 warning锛岃嫢鏃?warning 鍗充负鎴愬姛锛?
